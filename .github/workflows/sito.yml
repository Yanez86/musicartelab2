name: Sito

on:
  push:
    branches: [master]
  pull_request:
  # Ricostruisce il sito ogni notte: così l'evento in evidenza passa al
  # successivo il giorno dopo e quelli di oltre un anno vanno in archivio.
  # L'orario è in UTC: 23:05 UTC = 00:05 in Italia (01:05 con l'ora legale).
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sito-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # "Oggi" va calcolato con l'ora italiana, non con quella del server.
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
